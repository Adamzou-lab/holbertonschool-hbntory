# nginx sert le front statique ET relaie /query vers le Service IA.
#
# Pourquoi un proxy plutôt qu'un appel direct du navigateur vers
# http://127.0.0.1:8080 :
#  - L'appel devient same-origin : plus de dépendance au CORS.
#  - Plus d'URL d'hôte codée en dur côté JS : le navigateur appelle
#    simplement /query sur l'origine qui lui a servi la page.
#  - Surtout : sur le poste de dev, un port-forward (VS Code Remote) peut
#    déjà tenir 127.0.0.1:8080 et détourner silencieusement les requêtes
#    vers un autre Service IA que celui du compose — le navigateur reçoit
#    alors une réponse plausible mais issue de données périmées. Passer par
#    le réseau interne de Compose (ai_service:8080) supprime cette ambiguïté.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /query {
        # DNS embarqué de Docker. Combiné à une variable, il force nginx à
        # résoudre `ai_service` à chaque requête plutôt qu'au chargement de la
        # conf : le conteneur démarre même si ai_service n'est pas encore prêt.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ai_service_upstream "ai_service:8080";
        proxy_pass http://$ai_service_upstream/query;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Un appel agent enchaîne plusieurs allers-retours LLM + outils MCP :
        # compter large, le défaut de 60s est trop court pour les questions
        # analytiques.
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}
