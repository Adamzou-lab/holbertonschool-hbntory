<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Connexion — Zaiko</title>
<script>
(function () {
  var theme = localStorage.getItem('zaiko-theme') || 'dark';
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="logo-mark">Z</div>
    <h2>Connexion à Zaiko</h2>
    <p>Accède au stock de ta branche</p>

    {% if error %}
    <div class="flash error">{{ error }}</div>
    {% endif %}

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" required autofocus>
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" name="password" required>
      </div>
      <button class="btn-primary" type="submit" style="width:100%;justify-content:center;margin-top:6px;">Se connecter</button>
    </form>
  </div>
</div>
</body>
</html>
