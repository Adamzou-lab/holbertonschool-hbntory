<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Connexion — StockFlow</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body data-theme="dark">
<div class="login-wrap">
  <div class="login-card">
    <div class="logo-mark">S</div>
    <h2>Connexion à StockFlow</h2>
    <p>Accède au stock de ta branche</p>

    {% if error %}
    <div class="flash error">{{ error }}</div>
    {% endif %}

    <form method="post">
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" required autofocus>
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" name="password" required>
      </div>
      <button class="btn-primary" type="submit" style="width:100%;justify-content:center;margin-top:6px;">Se connecter</button>
    </form>
  </div>
</div>
</body>
</html>
